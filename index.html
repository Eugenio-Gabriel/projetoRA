<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Primeiros Socorros – AR</title>

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      background: #DEF4F5;
    }

    /* TELA INICIAL */
    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      background: linear-gradient(180deg, #5CC9C4 0%, #B3ECE4 45%, #F7F6E6 100%);
      padding: 4vh 4vw;
      overflow-y: auto;
      z-index: 1000;
    }

    /* TÍTULO */
    #startScreen h1 {
      font-size: clamp(26px, 7vw, 38px);
      font-weight: 900;
      color: #064F57;
      margin-bottom: 2vh;
      text-shadow: 0px 2px 0px #B6EDE9;
      letter-spacing: 1px;
    }

    #startScreen p {
      font-size: clamp(14px, 4vw, 17px);
      color: #064F57;
      line-height: 1.5em;
      max-width: 420px;
      margin: 1.2vh 0;
    }

    /* CARROSSEL */
    .carousel-container {
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      margin: 20px auto;
      position: relative;
    }

    .carousel-track {
      display: flex;
      gap: 20px;
      transition: transform 0.3s ease;
    }

    /* CARD RESPONSIVO */
    .marker-card {
      width: 80vw;
      max-width: 280px;
      background: #ffffffCC;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      border-left: 8px solid #3DB7B3;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .marker-title {
      font-weight: 700;
      font-size: clamp(15px, 4vw, 18px);
      color: #05575C;
      margin-bottom: 12px;
    }

    .marker-frame {
      background: #FFFDF2;
      border: 3px solid #A2DAD5;
      border-radius: 14px;
      padding: 10px;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.12);
    }

    .marker-img {
      width: clamp(130px, 50vw, 180px);
      height: clamp(130px, 50vw, 180px);
      object-fit: contain;
      border-radius: 12px;
      background: #ffffff;
    }

    /* BOTÕES DO CARROSSEL */
    .carousel-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .carousel-btn {
      background: #0A676C;
      color: white;
      width: 42px;
      height: 42px;
      font-size: 20px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* BOTÃO COMEÇAR */
    #startBtn {
      margin-top: 3vh;
      padding: 1em 3em;
      font-size: clamp(15px, 4vw, 18px);
      border: none;
      border-radius: 14px;
      background: linear-gradient(160deg, #3DB7B3, #1D8F8A);
      color: #ffffff;
      font-weight: 800;
      box-shadow: 0 6px 0 #0A5E5A, 0 4px 12px rgba(0,0,0,0.25);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    #startBtn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #0A5E5A;
    }

    /* OLHO LÍQUIDO */
    #liquidEye {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 900;
    }

    #liquidEye svg {
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
    }
  </style>
</head>

<body>

  <div id="startScreen">

    <h1>Primeiros Socorros – RA</h1>

    <p>Visualize técnicas de primeiros socorros utilizando modelos 3D em Realidade Aumentada.</p>

    <!-- CARROSSEL -->
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">

        <div class="marker-card">
          <p class="marker-title">Posição das Mãos</p>
          <div class="marker-frame">
            <img src="assets/marcador_maos.png" class="marker-img">
          </div>
        </div>

        <div class="marker-card">
          <p class="marker-title">Engasgo</p>
          <div class="marker-frame">
            <img src="assets/marcador_engasgo.png" class="marker-img">
          </div>
        </div>

        <div class="marker-card">
          <p class="marker-title">Afogamento</p>
          <div class="marker-frame">
            <img src="assets/marcador_afogamento.png" class="marker-img">
          </div>
        </div>

      </div>
    </div>

    <!-- BOTÕES DO CARROSSEL -->
    <div class="carousel-buttons">
      <button class="carousel-btn" id="prevBtn">‹</button>
      <button class="carousel-btn" id="nextBtn">›</button>
    </div>

    <p>Toque em começar para abrir a experiência de RA.</p>

    <button id="startBtn">Começar</button>
  </div>

  <div id="liquidEye" onclick="alert('Créditos do projeto ou links extras.')">
    <svg width="50" height="50" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="16" fill="rgba(255,255,255,0.5)"/>
    </svg>
  </div>

  <script>
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "camera.html";
    });

    const track = document.getElementById('carouselTrack');
    const prev = document.getElementById('prevBtn');
    const next = document.getElementById('nextBtn');

    let index = 0;

    function updateCarousel() {
      const cardWidth = document.querySelector('.marker-card').offsetWidth + 20; // gap
      track.style.transform = `translateX(-${index * cardWidth}px)`;
    }

    next.onclick = () => {
      if (index < 2) index++;
      updateCarousel();
    };

    prev.onclick = () => {
      if (index > 0) index--;
      updateCarousel();
    };

    window.addEventListener('resize', updateCarousel);
  </script>

</body>
</html>
