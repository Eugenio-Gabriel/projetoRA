<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Primeiros Socorros – AR</title>

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #5CC9C4 0%, #B3ECE4 40%, #F7F6E6 100%);
    height: 100vh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* CONTAINER CENTRAL */
  #startScreen {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }

  /* TÍTULO */
  #startScreen h1 {
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 900;
    color: #064F57;
    margin-bottom: 10px;
  }

  #startScreen p {
    font-size: clamp(14px, 3.8vw, 17px);
    color: #064F57;
    margin-top: 4px;
    margin-bottom: 18px;
  }

  /* CARROSSEL */
  .carousel-container {
    width: 100%;
    overflow: hidden;
    margin: 0 auto;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.3s ease;
    gap: 16px;
  }

  .marker-card {
    background: #ffffffcc;
    border-radius: 20px;
    padding: 18px;
    width: 80%;
    max-width: 260px;
    border-left: 8px solid #3DB7B3;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    flex-shrink: 0;
    margin: 0 auto;
  }

  .marker-title {
    font-size: 18px;
    font-weight: 700;
    color: #05575C;
    margin-bottom: 10px;
  }

  .marker-frame {
    background: #FFFDF2;
    border: 3px solid #A2DAD5;
    border-radius: 14px;
    padding: 10px;
  }

  .marker-img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    background: white;
    border-radius: 10px;
  }

  /* BOTÕES */
  .carousel-buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 14px 0;
  }

  .carousel-btn {
    background: #0A676C;
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  #startBtn {
    padding: 1em 3em;
    font-size: 18px;
    background: linear-gradient(160deg, #3DB7B3, #1D8F8A);
    color: white;
    border: none;
    border-radius: 14px;
    font-weight: 800;
    box-shadow: 0 6px 0 #0A5E5A;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="startScreen">

  <h1>Primeiros Socorros – RA</h1>
  <p>Visualize técnicas de primeiros socorros utilizando modelos 3D em Realidade Aumentada.</p>

  <!-- CARROSSEL -->
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">

      <div class="marker-card">
        <p class="marker-title">Posição das Mãos</p>
        <div class="marker-frame"><img src="assets/marcador_maos.png" class="marker-img"></div>
      </div>

      <div class="marker-card">
        <p class="marker-title">Engasgo</p>
        <div class="marker-frame"><img src="assets/marcador_engasgo.png" class="marker-img"></div>
      </div>

      <div class="marker-card">
        <p class="marker-title">Afogamento</p>
        <div class="marker-frame"><img src="assets/marcador_afogamento.png" class="marker-img"></div>
      </div>

    </div>
  </div>

  <!-- Botões -->
  <div class="carousel-buttons">
    <button class="carousel-btn" id="prevBtn">‹</button>
    <button class="carousel-btn" id="nextBtn">›</button>
  </div>

  <button id="startBtn">Começar</button>
</div>

<script>
  const track = document.getElementById('carouselTrack');
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  let index = 0;

  function updateCarousel() {
    const cardWidth = document.querySelector('.marker-card').offsetWidth + 16;
    track.style.transform = `translateX(-${index * cardWidth}px)`;
  }

  next.onclick = () => { if (index < 2) index++; updateCarousel(); };
  prev.onclick = () => { if (index > 0) index--; updateCarousel(); };

  window.addEventListener('resize', updateCarousel);
</script>

</body>
</html>
