<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelos 3D – Visualização</title>

<!-- Model Viewer -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(180deg, #5CC9C4 0%, #B3ECE4 45%, #F7F6E6 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 🔥 BOTÃO VOLTAR FIXO NO CANTO ESQUERDO */
  #backBtnTop {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 10px 18px;
    background: #0A676C;
    color: white;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    z-index: 999;
    border: none;
  }

  header {
    width: 100%;
    text-align: center;
    padding: 60px 20px 20px;
    color: #064F57;
  }

  h1 {
    font-weight: 900;
    margin: 0;
  }

  .viewer-card {
    width: 90%;
    max-width: 380px;
    background: #ffffffdd;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 25px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }

  .viewer-title {
    font-size: 18px;
    color: #05575C;
    font-weight: 700;
    margin-bottom: 12px;
  }

  model-viewer {
    width: 100%;
    height: 300px;
    border-radius: 12px;
    background: #EAF7F5;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 15px;
  }

  .btn-ar, .btn-floor {
    flex: 1;
    padding: 10px;
    border: none;
    color: white;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-ar {
    background: #1D8F8A;
  }

  .btn-floor {
    background: #0A676C;
  }

</style>
</head>

<body>

<!-- 🔥 BOTÃO VOLTAR NO CANTO ESQUERDO -->
<button id="backBtnTop" onclick="window.location.href='index.html'">← Voltar</button>

<header>
  <h1>Modelos 3D</h1>
  <p>Visualize os modelos antes de iniciar a câmera</p>
</header>

<!-- CARD 1 — MÃOS -->
<div class="viewer-card">
  <div class="viewer-title">Posição das Mãos</div>

  <model-viewer id="maosViewer"
    src="assets/palm_plant.glb"
    auto-rotate
    camera-controls
    ar
    ar-modes="scene-viewer webxr quick-look">
  </model-viewer>

  <div class="btn-row">
    <button class="btn-ar" onclick="window.location.href='camera.html'">
      AR com Marcador
    </button>

    <button class="btn-floor" onclick="document.querySelector('#maosViewer').activateAR()">
      AR sem Marcador
    </button>
  </div>
</div>

<!-- CARD 2 — AFOGAMENTO -->
<div class="viewer-card">
  <div class="viewer-title">Afogamento – Procedimento</div>
  <model-viewer src="assets/administering.glb" auto-rotate camera-controls></model-viewer>
</div>

</body>
</html>
