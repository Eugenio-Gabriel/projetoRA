<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR – Posicionamento de Plantas</title>

<style>
  body { margin: 0; overflow: hidden; }

  #backBtn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 10px 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    z-index: 10;
  }

  #suggestionBox {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    padding: 12px 18px;
    color: white;
    border-radius: 10px;
    font-size: 14px;
    font-family: Poppins;
    z-index: 10;
    display: none;
  }
</style>

</head>

<body>

<div id="backBtn" onclick="window.location.href='modelos.html'">← Voltar</div>
<div id="suggestionBox"></div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.152.2';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.152.2/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let xrSession, reticle, hitTestSource = null;
let plantModel;

// Sugestões automáticas
const suggestions = [
  "Ótimo espaço! A planta fica perfeita perto de janelas.",
  "Boa posição! Esse canto traz equilíbrio ao ambiente.",
  "Iluminação excelente, planta recomendada aqui.",
  "Lugar ideal! Perfeito para criar um ambiente mais natural."
];

function showSuggestion() {
  const box = document.getElementById("suggestionBox");
  box.innerText = suggestions[Math.floor(Math.random() * suggestions.length)];
  box.style.display = "block";
  setTimeout(() => box.style.display = "none", 3500);
}

init();

async function init() {

  // ======================================
  // 🔥 1. VERIFICAÇÃO DE SUPORTE WEBXR
  // ======================================
  if (!navigator.xr) {
    alert("Seu dispositivo não suporta WebXR. Use Android + Chrome.");
    return;
  }

  const supported = await navigator.xr.isSessionSupported("immersive-ar");
  if (!supported) {
    alert("Este dispositivo não suporta AR sem marcador.\nSafari (iPhone) não funciona.");
    return;
  }

  // ======================================
  // 🔥 2. RENDERER + CENA
  // ======================================
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8888ff, 1));

  // ======================================
  // 🔥 3. RETÍCULO
  // ======================================
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.1, 0.12, 32),
    new THREE.MeshBasicMaterial({ color: 0x00ff99 })
  );
  reticle.rotation.x = -Math.PI / 2;
  reticle.visible = false;
  scene.add(reticle);

  // ======================================
  // 🔥 4. CARREGAR A PLANTA
  // ======================================
  const loader = new GLTFLoader();
  loader.load("assets/palm_plant.glb", (gltf) => {
    plantModel = gltf.scene;
    plantModel.scale.set(0.4, 0.4, 0.4);
  });

  // ======================================
  // 🔥 5. INICIAR SESSÃO AR
  // ======================================
  xrSession = await navigator.xr.requestSession("immersive-ar", {
    requiredFeatures: ["hit-test", "dom-overlay"],
    domOverlay: { root: document.body }
  });

  renderer.xr.setSession(xrSession);

  const referenceSpace = await xrSession.requestReferenceSpace("local");
  const viewerSpace = await xrSession.requestReferenceSpace("viewer");

  hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

  // ======================================
  // 🔥 6. LOOP DA ANIMAÇÃO
  // ======================================
  renderer.setAnimationLoop((timestamp, frame) => {
    if (!frame) return;

    const hits = frame.getHitTestResults(hitTestSource);

    if (hits.length > 0) {
      const pose = hits[0].getPose(referenceSpace);
      reticle.visible = true;
      reticle.position.copy(pose.transform.position);
    }

    renderer.render(scene, camera);
  });

  // ======================================
  // 🔥 7. TOQUE PARA COLOCAR A PLANTA
  // ======================================
  renderer.domElement.addEventListener("click", () => {
    if (reticle.visible && plantModel) {
      const clone = plantModel.clone();
      clone.position.copy(reticle.position);
      scene.add(clone);
      showSuggestion();
    }
  });
}
</script>

</body>
</html>
