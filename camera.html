<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AR – Posicionamento de Plantas</title>

<style>
  body { margin: 0; overflow: hidden; }

  #backBtn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 10px 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    z-index: 10;
  }

  #suggestionBox {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    padding: 12px 18px;
    color: white;
    border-radius: 10px;
    font-size: 14px;
    font-family: Poppins;
    z-index: 10;
    display: none;
  }
</style>

</head>

<body>

<div id="backBtn" onclick="window.location.href='modelos.html'">← Voltar</div>
<div id="suggestionBox"></div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.152.2';
import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.152.2/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let xrSession, reticle;
let plantModel;

// Sugestões automáticas
const suggestions = [
  "Ótimo espaço! A planta fica perfeita perto de janelas.",
  "Boa posição! Esse canto traz equilíbrio ao ambiente.",
  "Iluminação excelente, planta recomendada aqui.",
  "Lugar ideal! Perfeito para criar um ambiente mais natural."
];

const suggestionBox = document.getElementById("suggestionBox");
function showSuggestion() {
  suggestionBox.innerText = suggestions[Math.floor(Math.random() * suggestions.length)];
  suggestionBox.style.display = "block";
  setTimeout(() => { suggestionBox.style.display = "none"; }, 3500);
}

// INICIALIZAÇÃO
init();

async function init() {
  const container = document.body;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  container.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera();

  // Luz
  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Reticle (ponto onde a planta vai aparecer)
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.1, 0.12, 32),
    new THREE.MeshBasicMaterial({ color: 0x00ff99 })
  );
  reticle.rotation.x = -Math.PI / 2;
  reticle.visible = false;
  scene.add(reticle);

  // Carregar planta
  const loader = new GLTFLoader();
  loader.load("assets/palm_plant.glb", (gltf) => {
    plantModel = gltf.scene;
    plantModel.scale.set(0.4, 0.4, 0.4);
  });

  // Iniciar AR
  xrSession = await navigator.xr.requestSession("immersive-ar", {
    requiredFeatures: ["hit-test", "dom-overlay"],
    domOverlay: { root: document.body }
  });

  renderer.xr.setSession(xrSession);

  const referenceSpace = await xrSession.requestReferenceSpace("local");
  const viewerSpace = await xrSession.requestReferenceSpace("viewer");
  const hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

  renderer.setAnimationLoop((timestamp, frame) => {
    if (!frame) return;

    const hitTestResults = frame.getHitTestResults(hitTestSource);

    if (hitTestResults.length > 0) {
      const pose = hitTestResults[0].getPose(referenceSpace);
      reticle.visible = true;
      reticle.position.set(
        pose.transform.position.x,
        pose.transform.position.y,
        pose.transform.position.z
      );
    }

    renderer.render(scene, camera);
  });

  // Toque na tela para colocar planta
  renderer.domElement.addEventListener("click", () => {
    if (reticle.visible && plantModel) {
      const clone = plantModel.clone();
      clone.position.copy(reticle.position);
      scene.add(clone);

      showSuggestion();
    }
  });
}
</script>

</body>
</html>
