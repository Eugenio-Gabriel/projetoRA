<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Posição das Mãos – AR no Chão</title>

  <!-- MODEL VIEWER -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    #backBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px 18px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      z-index: 1000;
      border: 2px solid white;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

  <button id="backBtn" onclick="window.location.href='modelos.html'">← Voltar</button>

  <model-viewer
    id="arHands"
    src="assets/maos.glb"
    ar
    ar-placement="floor"
    ar-scale="auto"
    ar-modes="webxr scene-viewer quick-look"
    auto-rotate
    camera-controls
    disable-zoom>
  </model-viewer>

  <script>
    // Abre o AR automaticamente assim que a página carregar
    window.onload = () => {
      const viewer = document.querySelector("#arHands");
      viewer.activateAR();
    };
  </script>

</body>
</html>
